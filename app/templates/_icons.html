{# Linien-Icons (24er Raster, Strichstärke folgt der Schrift). Aufruf: icon("check") #}
{% macro icon(key, size=20, cls="") -%}
<svg class="icon {{ cls }}" viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if key == "today" %}<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M9 15.5l2 2 4-4"/>
  {%- elif key == "supplements" %}<path d="M10.5 20.5a4.95 4.95 0 1 1-7-7l10-10a4.95 4.95 0 1 1 7 7z"/><path d="M8.5 8.5l7 7"/>
  {%- elif key == "stock" %}<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
  {%- elif key == "weight" %}<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 11a5 5 0 0 1 9 0M12 11l1.5-2.5"/>
  {%- elif key == "history" %}<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-3"/>
  {%- elif key == "settings" %}<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>
  {%- elif key == "chevron-left" %}<path d="m15 18-6-6 6-6"/>
  {%- elif key == "chevron-right" %}<path d="m9 18 6-6-6-6"/>
  {%- elif key == "check" %}<path d="M20 6 9 17l-5-5"/>
  {%- elif key == "check-circle" %}<circle cx="12" cy="12" r="9.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
  {%- elif key == "alert" %}<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
  {%- elif key == "info" %}<circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4M12 8h.01"/>
  {%- elif key == "cart" %}<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h2.5l2.6 11.6a2 2 0 0 0 2 1.4h8.6a2 2 0 0 0 2-1.5L21 7H5.4"/>
  {%- elif key == "trash" %}<path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M18.5 6l-.8 13.1a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 6M10 11v5.5M14 11v5.5"/>
  {%- elif key == "pencil" %}<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="m14.5 5.5 3 3"/>
  {%- elif key == "pause" %}<path d="M9 5v14M15 5v14"/>
  {%- elif key == "play" %}<path d="M7 4.5v15l12-7.5z"/>
  {%- elif key == "plus" %}<path d="M12 5v14M5 12h14"/>
  {%- elif key == "minus" %}<path d="M5 12h14"/>
  {%- elif key == "external" %}<path d="M14 4h6v6M10 14 20 4M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/>
  {%- elif key == "camera" %}<path d="M14.5 4h-5L7.5 7H4.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>
  {%- elif key == "nfc" %}<path d="M6 8.3a7.4 7.4 0 0 1 0 7.4M9.5 6.2a11.8 11.8 0 0 1 0 11.6M12.9 4.1a15.9 15.9 0 0 1 0 15.8M16.4 2a20.2 20.2 0 0 1 0 20"/>
  {%- elif key == "send" %}<path d="M21.5 2.5 10.5 13.5M21.5 2.5l-7 19-4-8-8-4z"/>
  {%- elif key == "box" %}<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 12h18M12 4v16"/>
  {%- elif key == "logout" %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
  {%- elif key == "copy" %}<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/>
  {%- endif %}
</svg>
{%- endmacro %}

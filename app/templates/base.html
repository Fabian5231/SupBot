<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151c">
  <title>{% block title %}SupBot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
</head>
<body>
{% if nav %}
<header class="topbar">
  <a class="brand" href="/">💊 <span>SupBot</span></a>
  <nav>
    <a href="/" class="{{ 'active' if nav == 'today' }}">Heute</a>
    <a href="/supplemente" class="{{ 'active' if nav == 'supplements' }}">Supplemente</a>
    <a href="/vorrat" class="{{ 'active' if nav == 'stock' }}">Vorrat</a>
    <a href="/verlauf" class="{{ 'active' if nav == 'history' }}">Verlauf</a>
    <a href="/einstellungen" class="{{ 'active' if nav == 'settings' }}">Einstellungen</a>
  </nav>
</header>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
